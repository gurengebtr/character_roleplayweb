name: MVP checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: ./setup.sh
      - run: ./setup.sh --check
      - run: npm run lint
      - run: npm audit --omit=dev
      - run: npm run typecheck
      - run: npm test
      - run: npm run contracts && git diff --exit-code -- packages/contracts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: always()
        run: docker compose -f deploy/local/compose.yaml down
