[project]
name = "ai-character"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pymongo>=4.13,<5",
  "httpx>=0.28,<1", "pydantic-settings>=2.8,<3", "cryptography>=44",
  "PyJWT[crypto]>=2.10,<3", "qdrant-client>=1.17,<1.18", "fastembed>=0.9.1,<1",
  "pytest>=8,<10", "pytest-asyncio>=0.26,<2", "ruff>=0.11,<1"
]

[tool.pytest.ini_options]
pythonpath = ["services/api", "services/rag", "."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
